server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gerenciamentoimoveispi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# Storage S3/R2 - valores reais vêm de variáveis de ambiente em produção
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:${CLOUDFLARE_R2_ACCESS_KEY:}}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:${CLOUDFLARE_R2_SECRET_KEY:}}
storage.s3.bucket=${STORAGE_S3_BUCKET:${CLOUDFLARE_R2_BUCKET}}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:${CLOUDFLARE_R2_ENDPOINT:}}
storage.s3.public-url=${STORAGE_S3_PUBLIC_URL:${CLOUDFLARE_R2_PUBLIC_URL}}
storage.s3.region=${STORAGE_S3_REGION:auto}
storage.s3.path-style=${STORAGE_S3_PATH_STYLE:true}

# JWT - secret real vem de variável de ambiente (.env) em produção
jwt.secret=${JWT_SECRET:chave-secreta-super-segura-minima-32-caracteres}

# E-mail (recuperação de senha) - credenciais reais vêm de variáveis de ambiente (.env)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}