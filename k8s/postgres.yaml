apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: imoveis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: gerenciamentoimoveispi
            - name: POSTGRES_USER
              value: imoveis
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: imoveis-env
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: imoveis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: imoveis
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432