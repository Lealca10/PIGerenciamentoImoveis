apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: imoveis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: imoveis-backend
      containers:
        - name: backend
          image: 533266955243.dkr.ecr.us-east-1.amazonaws.com/bluvagas-production/imoveis:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.imoveis.svc.cluster.local:5432/gerenciamentoimoveispi
            - name: SPRING_DATASOURCE_USERNAME
              value: imoveis
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: imoveis-env
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: imoveis-env
                  key: JWT_SECRET
            - name: STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: imoveis-env
                  key: CLOUDFLARE_R2_ACCESS_KEY
            - name: STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: imoveis-env
                  key: CLOUDFLARE_R2_SECRET_KEY
            - name: STORAGE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: imoveis-env
                  key: CLOUDFLARE_R2_BUCKET
            - name: STORAGE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: imoveis-env
                  key: CLOUDFLARE_R2_ENDPOINT
            - name: STORAGE_S3_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: imoveis-env
                  key: CLOUDFLARE_R2_PUBLIC_URL
            - name: STORAGE_S3_REGION
              value: auto
            - name: STORAGE_S3_PATH_STYLE
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 400m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: imoveis
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080
